# Development stack: Flask (auto-reload, source mounted) + nginx-served frontend.
#   docker compose up --build
#   → UI  http://localhost:3000   API http://localhost:5000
services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    command: ["python", "app.py"]
    ports:
      - "${BACKEND_PORT:-5000}:5000"   # macOS: AirPlay may hold 5000 → BACKEND_PORT=5001 docker compose up
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=true
      - FLASK_PORT=5000
      - FLASK_SECRET_KEY=dev-secret-key-change-in-production
      - JWT_SECRET_KEY=dev-jwt-secret-key-change-in-production-32b
      - DATABASE_URL=sqlite:///storage/ledger.db
      - CERT_STORAGE_PATH=storage/certificates/
      - TEMP_STORAGE_PATH=storage/temp/
      - RSA_PRIVATE_KEY_PATH=keys/private.pem
      - RSA_PUBLIC_KEY_PATH=keys/public.pem
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - LOG_FORMAT=console
      - ADMIN_EMAIL=admin@recguard.io
      - ADMIN_PASSWORD=changeme
    volumes:
      - ./backend:/app            # Hot reload
      - rec_storage:/app/storage
      - rec_keys:/app/keys
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  rec_storage:
  rec_keys:
