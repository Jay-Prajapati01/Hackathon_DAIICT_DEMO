name: REC Guard CI

on:
  push:
    branches: [main, develop, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-dejavu-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: |
          black --check -l 120 .
          flake8
      - name: Generate RSA key pair
        run: python scripts/generate_keys.py
      - name: Run tests
        run: pytest tests/ -v --cov=. --cov-report=term-missing -p no:logging

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f docker/Dockerfile.backend -t rec-guard-backend .
      - name: Build frontend image
        run: docker build -f docker/Dockerfile.frontend -t rec-guard-frontend .
